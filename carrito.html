<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Carrito de compras y reservas de Fan Packs en SoundDay.">
    <title>SoundDay / Carrito</title>
    <!-- Hojas de estilos -->
    <link rel="stylesheet" href="./recursos/estilos/estilos.css">
    <link rel="stylesheet" href="./recursos/estilos/carrito.css">
</head>

<body class="pagina">

    <header class="encabezado-principal">

        <a class="encabezado-principal__logo-enlace" href="./index.html" aria-label="Ir al inicio">
            <img class="encabezado-principal__logo-img" src="./recursos/imagenes/logos/soundday_white.png" alt="Logo SoundDay">
        </a>

        <nav class="encabezado-principal__nav">
            <a class="encabezado-principal__nav-enlace" href="./index.html">Inicio</a>

            <a class="encabezado-principal__nav-enlace" href="./artistas.html">
                Artistas
            </a>

            <a class="encabezado-principal__nav-enlace" href="./contacto.html">Contacto</a>

            <a class="encabezado-principal__nav-perfil encabezado-principal__nav-perfil--activo" href="./carrito.html" aria-label="Ir al carrito">
                <img class="encabezado-principal__perfil-img" src="./recursos/imagenes/logos/carrito.png" alt="Ir al carrito">
            </a>

            <a class="encabezado-principal__nav-perfil" href="./perfil.html" aria-label="Ir al perfil">
                <img class="encabezado-principal__perfil-img" src="./recursos/imagenes/logos/usuario.png" alt="Ir al perfil">
            </a>
        </nav>

    </header>

    <main class="contenido-principal">
        <section class="carrito-seccion" aria-labelledby="titulo-carrito">
            <h1 class="carrito-titulo" id="titulo-carrito">
                Carrito de Fan Packs y Reservas
            </h1>

            <p class="carrito-descripcion">
                Revisá los Fan Packs que seleccionaste, ajustá tus reservas y confirmá tu pedido mediante WhatsApp o correo electrónico.
            </p>

            <!-- Notificación accesible de estado (role="alert") -->
            <div id="notificacion-carrito" class="carrito-notificacion" role="alert" aria-live="polite" style="display: none;"></div>

            <!-- Grilla donde JavaScript inyecta los productos -->
            <ul class="carrito-grilla" id="grilla-carrito">
                <!-- Se llena dinámicamente -->
            </ul>

            <!-- Resumen y botones de confirmación general -->
            <div class="carrito-resumen">
                <p class="carrito-resumen__total">
                    Total general: <span class="carrito-resumen__monto" id="carrito-total-monto">$0</span>
                </p>

                <div class="carrito-resumen__acciones">
                    <button type="button" class="carrito-boton-accion" id="btn-confirmar-whatsapp">
                        📲 Confirmar pedido por WhatsApp
                    </button>

                    <button type="button" class="carrito-boton-accion" id="btn-confirmar-email">
                        📧 Enviar comprobante por Email
                    </button>
                </div>
            </div>
        </section>
    </main>

    <!-- Pie de página general -->
    <footer class="pie-principal">
        <p class="pie-principal__copyright">© 2026 SoundDay.com.ar</p>
        <ul class="pie-principal__lista">
            <li class="pie-principal__item">
                <a class="pie-principal__enlace" href="https://instagram.com/soundday" target="_blank" rel="noopener noreferrer">@soundday</a>
            </li>
            <li class="pie-principal__item">Av. Figueroa Alcorta 1354</li>
            <li class="pie-principal__item">
                <a class="pie-principal__enlace" href="./contacto.html">Contacto</a>
            </li>
        </ul>
    </footer>

    <!-- Script principal del carrito -->
    <script type="module" src="./recursos/js/carrito.js"></script>

</body>

</html>
